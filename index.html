<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Skill Bingo Slots</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0D0D1A;
      overflow: hidden;
    }
    #game-container {
      width: 100%;
      height: 100%;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      box-sizing: border-box;
    }
    canvas {
      display: block;
    }
    #rotate-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #0D0D1A;
      color: #F0F0FF;
      font-family: 'Nunito', sans-serif;
      font-size: 24px;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 9999;
    }
    @media (orientation: landscape) and (max-height: 500px) {
      #rotate-overlay { display: flex; }
    }
  </style>
</head>
<body>
  <div id="rotate-overlay">Please rotate your device to portrait mode</div>
  <div id="game-container"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
